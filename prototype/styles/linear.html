<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>风格 B · Linear 式 · Agent-Toolbox</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
:root {
  --bg: #08090a; --panel: #0f1011; --surface: rgba(255,255,255,0.03); --hover: rgba(255,255,255,0.05);
  --line: rgba(255,255,255,0.08); --line-2: #34343a;
  --ink: #f7f8f8; --ink-2: #d0d6e0; --ink-3: #8a8f98;
  --accent: #5e6ad2; --accent-hover: #7170ff; --accent-ink: #828fff; --accent-soft: rgba(94,106,210,0.16); --on-accent: #fff;
  --ok: #4cc38a; --ok-dot: #10b981; --warn: #eab308; --bad: #f2555a;
  --code-bg: rgba(255,255,255,0.02);
  --f-display: "Inter", "SF Pro Display", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-body: var(--f-display);
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-features: "cv01", "ss03";
  --h-weight: 510; --h-track: -0.012em; --nav-weight: 510; --btn-weight: 510; --num-weight: 510;
  --f-num: var(--f-display);
  --r-btn: 6px; --r-input: 6px; --r-card: 8px; --r-chip: 4px;
  --card-border: 1px solid rgba(255,255,255,0.08); --card-shadow: none;
  --btn2-bg: rgba(255,255,255,0.02); --btn-h: 30px; --pad-card: 18px; --gap: 12px;
  --top-bg: #08090a; --side-bg: #0f1011; --side-on-bg: rgba(255,255,255,0.06); --side-on-shadow: none;
  --seg-bg: rgba(255,255,255,0.02); --seg-on-bg: rgba(255,255,255,0.08); --seg-on-shadow: none;
  --tab-mark: #f7f8f8; --brand-mark: #f7f8f8;
  --ds-page: #1b1c1f; --ds-bar-bg: #0f1011; --ds-bar-ink: #f7f8f8; --ds-bar-line: #2a2b2f;
}
body { color-scheme: dark; }
.app { font-size: 13px; letter-spacing: -0.01em; }
.app .tabs a { font-size: 13px; }
.app .page-h h1 { font-size: 22px; font-weight: 590; letter-spacing: -0.24px; }
.app .kpi-n { font-size: 28px; letter-spacing: -0.03em; }
.app .tabs a[aria-current="page"] { box-shadow: none; background: rgba(255,255,255,0.06); height: 30px; border-radius: 6px; }
.app .tabs { align-items: center; }
.app .btn:not(.pri) { color: #e2e4e7; border-color: rgb(36,40,44); }
.app .host { color: var(--ink-2); }
</style>
</head>
<body>
<header class="ds-bar"><div class="ds-title"><b>风格 B · Linear 式：深色精密工具</b><span>近黑底 + 半透明层级，靛蓝只点在主操作上</span></div>
<a href="index.html">返回总览</a><a href="stripe.html">上一套</a><a href="vercel.html">下一套</a></header>
<main class="ds-wrap">
  <div class="frame"><div data-cockpit></div></div>
  <section class="traits" aria-label="风格特点">
    <div><b>色彩</b><p>底色 #08090A，卡片用 3% 白色半透明叠加，分割线只有 8% 白；靛蓝 #5E6AD2 只出现在主按钮和焦点上。</p></div>
    <div><b>字体</b><p>Inter 搭配 510 中间字重，13px 紧凑界面字号，整体字距微收。</p></div>
    <div><b>形态</b><p>不用投影，靠背景透明度逐级抬升；选中态是浅色底块而不是下划线。</p></div>
    <div><b>适合</b><p>开发者长时间盯屏的高密度工作台，最有"新一代工具"的感觉。</p></div>
    <div class="note"><b>字体说明</b><p>原规范的等宽字体 Berkeley Mono 是商业字体，这里用开源的 JetBrains Mono 替代。</p></div>
  </section>
</main>
<script src="shared/cockpit.js"></script>
</body>
</html>
