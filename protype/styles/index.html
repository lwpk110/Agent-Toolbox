<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent-Toolbox · 风格选择</title>
<link rel="stylesheet" href="shared/base.css">
<style>
body { background: #f3f4f6; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: #111827; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 48px 24px 64px; display: grid; gap: 32px; }
.head h1 { margin: 0 0 8px; font-size: 32px; line-height: 1.2; letter-spacing: -0.02em; }
.head p { margin: 0; color: #4b5563; font-size: 16px; line-height: 1.6; max-width: 72ch; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.opt { display: grid; grid-template-rows: auto 1fr; text-decoration: none; color: inherit; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; transition: border-color 150ms ease-out, box-shadow 150ms ease-out; }
@media (hover: hover) { .opt:hover { border-color: #111827; box-shadow: 0 8px 24px rgba(0,0,0,.08); } }
.opt:focus-visible { outline: 2px solid #111827; outline-offset: 3px; }
.thumb { height: 148px; padding: 16px; display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 12px; }
.t-side { border-radius: 6px; }
.t-main { display: grid; grid-template-rows: auto 1fr auto; gap: 8px; }
.t-row { display: flex; align-items: center; gap: 8px; }
.t-aa { font-size: 26px; line-height: 1; }
.t-btn { margin-left: auto; font-size: 11px; padding: 5px 10px; white-space: nowrap; }
.t-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.t-cards span { border-radius: 4px; display: grid; align-content: center; padding: 0 8px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.t-dots { display: flex; gap: 6px; }
.t-dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.meta { padding: 16px 20px 20px; border-top: 1px solid #f0f0f0; display: grid; gap: 4px; align-content: start; }
.meta b { font-size: 16px; }
.meta span { color: #4b5563; font-size: 14px; line-height: 1.6; }
.tag { font: 600 12px ui-monospace, Consolas, monospace; color: #6b7280; letter-spacing: .04em; }
.foot { color: #4b5563; font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <h1>Agent-Toolbox 风格选择</h1>
    <p>7 个选项用同一屏「全景驾驶舱」、同一份数据，只换视觉语言。点开任一张卡片查看完整页面，页面顶部可以前后翻看。选好后告诉我字母，我会把它套用到全部 6 个界面。</p>
  </header>
  <div class="grid" id="grid"></div>
  <p class="foot">各风格的颜色、字体和组件形态取自设计库中对应设计系统的规范；页面只借用视觉语言，不使用这些公司的 Logo 或名称。之前做的线稿图在 <a href="../wireframes.html">wireframes.html</a>。</p>
</main>
<script>
var opts = [
  { f: 'stripe.html', k: 'A', n: 'Stripe 式 · 精致金融科技', d: '白底 + 靛紫强调，细字重大标题，蓝调柔和投影。和文档原规范最接近。', bg: '#f6f9fc', side: '#ffffff', card: '#ffffff', line: '#e5edf5', ink: '#061b31', acc: '#533afd', accInk: '#fff', font: '-apple-system, "Segoe UI", sans-serif', w: 300, dots: ['#15be53', '#9b6829', '#ea2261'], r: '4px' },
  { f: 'linear.html', k: 'B', n: 'Linear 式 · 深色精密工具', d: '近黑底 + 半透明层级，靛蓝只点在主操作上，最有"新一代工具"感。', bg: '#08090a', side: '#0f1011', card: '#151617', line: 'rgba(255,255,255,.08)', ink: '#f7f8f8', acc: '#5e6ad2', accInk: '#fff', font: 'Inter, sans-serif', w: 500, dots: ['#10b981', '#eab308', '#f2555a'], r: '6px' },
  { f: 'vercel.html', k: 'C', n: 'Vercel 式 · 黑白极简', d: '纯黑白灰，阴影描边代替边框，几乎不用彩色，内容就是主角。', bg: '#fafafa', side: '#fafafa', card: '#ffffff', line: '#ebebeb', ink: '#171717', acc: '#171717', accInk: '#fff', font: 'Geist, -apple-system, sans-serif', w: 600, dots: ['#16a34a', '#eab308', '#dc2626'], r: '6px' },
  { f: 'github.html', k: 'D', n: 'GitHub 式 · 开发者熟悉的高密度', d: '中性灰白，带标题条的描边盒子，绿色主按钮，橙色导航下划线。', bg: '#ffffff', side: '#f6f8fa', card: '#ffffff', line: '#d0d7de', ink: '#1f2328', acc: '#1f883d', accInk: '#fff', font: '-apple-system, "Segoe UI", sans-serif', w: 600, dots: ['#1a7f37', '#9a6700', '#cf222e'], r: '6px' },
  { f: 'supabase.html', k: 'E', n: 'Supabase 式 · 深色基础设施', d: '炭黑底 + 翡翠绿点缀，边框分层，胶囊形主按钮。', bg: '#171717', side: '#121212', card: '#1c1c1c', line: '#2e2e2e', ink: '#fafafa', acc: '#3ecf8e', accInk: '#0f0f0f', font: '"Helvetica Neue", sans-serif', w: 400, dots: ['#3ecf8e', '#f5c451', '#ff6b5e'], r: '9999px' },
  { f: 'ant.html', k: 'F', n: 'Ant Design 式 · 国内企业中后台', d: '深蓝侧栏 + 品牌蓝，灰底白卡片，国内团队上手成本最低。', bg: '#f5f5f5', side: '#001529', card: '#ffffff', line: '#f0f0f0', ink: 'rgba(0,0,0,.88)', acc: '#1677ff', accInk: '#fff', font: '"PingFang SC", "Microsoft YaHei", sans-serif', w: 600, dots: ['#52c41a', '#faad14', '#ff4d4f'], r: '6px' },
  { f: 'original.html', k: 'G', n: '文档原版 · 中性工作台 + 电光靛蓝', d: 'implementation_plan.md 定义的原始 Token，作为对照基准。', bg: '#F7F6F3', side: '#FAF9F6', card: '#ffffff', line: '#E5E5E0', ink: '#16181D', acc: '#4F46E5', accInk: '#fff', font: '"Plus Jakarta Sans", sans-serif', w: 700, dots: ['#10B981', '#F59E0B', '#EF4444'], r: '6px' }
];
var grid = document.getElementById('grid');
opts.forEach(function (o) {
  var a = document.createElement('a');
  a.className = 'opt';
  a.href = o.f;
  a.innerHTML =
    '<div class="thumb" style="background:' + o.bg + ';color:' + o.ink + '">' +
      '<div class="t-side" style="background:' + o.side + ';box-shadow:0 0 0 1px ' + o.line + '"></div>' +
      '<div class="t-main">' +
        '<div class="t-row"><span class="t-aa" style="font-family:' + o.font + ';font-weight:' + o.w + '">Aa 驾驶舱</span>' +
        '<span class="t-btn" style="background:' + o.acc + ';color:' + o.accInk + ';border-radius:' + o.r + (o.k === 'E' ? ';background:#0f0f0f;color:#fafafa;box-shadow:0 0 0 1px #fafafa' : '') + '">同步至 GitHub</span></div>' +
        '<div class="t-cards">' + ['89.7%', '5 · 14', '2 / 6'].map(function (n) { return '<span style="background:' + o.card + ';box-shadow:0 0 0 1px ' + o.line + ';font-family:' + o.font + '">' + n + '</span>'; }).join('') + '</div>' +
        '<div class="t-dots">' + o.dots.map(function (c) { return '<i style="background:' + c + '"></i>'; }).join('') + '</div>' +
      '</div></div>' +
    '<div class="meta"><span class="tag">风格 ' + o.k + '</span><b></b><span></span></div>';
  a.querySelector('.meta b').textContent = o.n;
  a.querySelector('.meta span:last-child').textContent = o.d;
  a.setAttribute('aria-label', '风格 ' + o.k + '：' + o.n);
  grid.appendChild(a);
});
</script>
</body>
</html>
